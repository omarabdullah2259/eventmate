{% extends "base.html" %}
{% block title %}{{ title or 'Error' }} — EventMate{% endblock %}
{% block body %}
<div class="page" style="display:flex;align-items:center;justify-content:center;min-height:60vh;">
    <div class="card" style="max-width:480px;width:100%;text-align:center;padding:2.5rem;">
        <div style="font-size:2.5rem;margin-bottom:1rem;">🚫</div>
        <h1 style="font-size:1.4rem;font-weight:800;margin-bottom:0.75rem;">{{ title or 'Access Denied' }}</h1>
        <p style="color:var(--muted);line-height:1.7;margin-bottom:1.5rem;">{{ message or 'You do not have permission to view this page.' }}</p>
        <a href="{{ back_url or '/' }}" class="btn btn-primary" style="display:inline-flex;">Go Back</a>
    </div>
</div>
{% endblock %}
